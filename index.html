<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Componentes de mi PC</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            text-align: center;
            margin: 0;
            padding: 0;
        }
        h1 {
            background-color: #333;
            color: #fff;
            margin: 0;
            padding: 20px 0;
        }
        .grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            padding: 20px;
        }
        .item {
            background-color: #fff;
            padding: 10px;
            border-radius: 10px;
            box-shadow: 0 0 5px rgba(0,0,0,0.2);
            width: 200px;
        }
        .item img {
            max-width: 100%;
            border-radius: 5px;
        }
        .item p {
            margin: 5px 0 0 0;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>Componentes de mi PC</h1>
    <div class="grid">
        <div class="item">
            <img src="img/caja1.png" alt="Caja PC">
            <p>Caja PC</p>
        </div>
        <div class="item">
            <img src="img/placa1.png" alt="Placa Base">
            <p>Placa Base</p>
        </div>
        <div class="item">
            <img src="img/ssd1.png" alt="SSD">
            <p>Disco SSD</p>
        </div>
        <div class="item">
            <img src="img/grafica1.png" alt="Tarjeta Gráfica">
            <p>Tarjeta Gráfica</p>
        </div>
        <div class="item">
            <img src="img/cooler1.png" alt="Disipador">
            <p>Disipador</p>
        </div>
        <div class="item">
            <img src="img/fuente1.png" alt="Fuente de Alimentación">
            <p>Fuente de Alimentación</p>
        </div>
        <div class="item">
            <img src="img/ram1.png" alt="Memoria RAM">
            <p>Memoria RAM</p>
        </div>
    </div>
</body>
</html>
